[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermen"
version = "0.1.0"
description = "A local-first vector database with a built-in model query engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Nas" }
]
dependencies = [
  "numpy>=1.26",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
local = [
  "llama-cpp-python>=0.3.7",
  "sentence-transformers>=3.0",
]
remote = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
hermen = "hermen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hermen"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
